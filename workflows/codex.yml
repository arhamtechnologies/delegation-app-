
name: Codex implementation

on:
  issues:
    types: [labeled]
  workflow_dispatch:

jobs:
  codex:
    if: github.event.label.name == 'codex'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v5

      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Review the repository and implement the requested issue.
            Run tests and lint.
            Create or update a pull request.
            Do not modify production databases.
          sandbox: workspace-write
