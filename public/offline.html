<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Offline · Delegation</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f5f6f7; color: #0f172a; padding: 16px; box-sizing: border-box; }
    main { width: 100%; max-width: 380px; padding: 28px 24px; border: 1px solid #e5e7eb; border-radius: 14px; background: #fff; text-align: center; }
    .mark { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 12px; background: #0000fe; color: #fff; font-weight: 700; font-size: 22px; }
    h1 { margin: 16px 0 6px; font-size: 20px; letter-spacing: -0.01em; }
    p { margin: 0 0 20px; color: #64748b; font-size: 15px; line-height: 1.5; }
    button { width: 100%; height: 44px; border: 0; border-radius: 8px; background: #0000fe; color: #fff; font: inherit; font-size: 16px; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">D</span>
    <h1>You're offline</h1>
    <p>Delegation needs an internet connection to load your tasks. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
